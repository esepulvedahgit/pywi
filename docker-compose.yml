# docker-compose.yml — configuración única para producción (amd64 y arm64)
# Uso:
#   docker compose up -d          # levanta con la imagen ya cargada
#   docker compose down           # para
#   docker compose logs -f        # ver logs en tiempo real
#
# Requisitos previos en el host:
#   1. Imagen creada: docker build -t pywi:local .
#   2. Archivo .env con ENCRYPTION_KEY, APP_URL e IMAGE_NAME
#
# Docker selecciona la arquitectura local al construir la imagen.

services:
  web-ide:
    image: ${IMAGE_NAME:-pywi:local}
    container_name: python-web-ide
    ports:
      - "${PYWI_BIND_IP:-127.0.0.1}:3000:3000"
    volumes:
      # Volumen nombrado para persistir datos de usuario (DB, proyectos, paquetes)
      - pywi_data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_URL=${APP_URL:-http://localhost:3000}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - TRUSTED_PROXY_IPS=${TRUSTED_PROXY_IPS:-}
      - AI_ALLOWED_BASE_URLS=${AI_ALLOWED_BASE_URLS:-}
      - EXEC_TIMEOUT_MS=${EXEC_TIMEOUT_MS:-180000}
      - INPUT_IDLE_TIMEOUT_MS=${INPUT_IDLE_TIMEOUT_MS:-600000}
    restart: always
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '2.0'

volumes:
  pywi_data:
