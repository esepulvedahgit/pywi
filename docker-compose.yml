services:
  web-ide:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: python-web-ide
    ports:
      - "0.0.0.0:3000:3000"
    volumes:
      # Bind mount source so cada docker compose up recompila con el código actual
      - .:/app
      # Shield container's node_modules and .venv from being overwritten by the host
      - /app/node_modules
      - /app/.venv
      # Explicit bind mount for requirements.txt
      - ./requirements.txt:/app/requirements.txt
      # Persist user data and databases in the host's data directory
      - ./data:/app/data
    command: sh -c "npm run build && npm start"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Pass environment variables (or fallbacks)
      - APP_URL=${APP_URL:-http://localhost:3000}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
    restart: always
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
