services:
  web-ide:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: python-web-ide
    ports:
      - "0.0.0.0:3000:3000"
    volumes:
      # Bind mount source so cada docker compose up recompila con el código actual
      - .:/app
      # Shield container's node_modules and .venv from being overwritten by the host
      - /app/node_modules
      - /app/.venv
      # Explicit bind mount for requirements.txt
      - ./requirements.txt:/app/requirements.txt
      # Persist user data and databases in the host's data directory
      - ./data:/app/data
    command: sh -c "npm run build && npm start"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Pass environment variables (or fallbacks)
      - APP_URL=${APP_URL:-http://localhost:3000}
      - JWT_SECRET=${JWT_SECRET}
      # ENCRYPTION_KEY: 64-char hex string (32 bytes) used to AES-256-GCM encrypt AI API keys at rest.
      # Generate with: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      # MUST be set in .env.local or as a host environment variable before starting the container.
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    restart: always
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
    # Architecture-specific accelerator config lives in override files:
    #   amd64 (NVIDIA GPU): docker compose -f docker-compose.yml -f docker-compose.amd64.yml up -d --build
    #   arm64 (Rockchip NPU): docker compose -f docker-compose.yml -f docker-compose.arm64.yml up -d --build
