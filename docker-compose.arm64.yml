# Override para arquitectura arm64 con NPU Rockchip RK3588S (Radxa 5A, Orange Pi 5, etc.)
# Uso: docker compose -f docker-compose.yml -f docker-compose.arm64.yml up -d --build
#
# Requisitos en el host:
#   - Kernel BSP de Rockchip (6.1.x con sufijo rk* o 5.10.x)
#   - Driver RKNPU v0.9.8 cargado (verificar: sudo cat /sys/kernel/debug/rknpu/version)
#
# RENDER_GID — GID del grupo 'render' del host (para acceso a /dev/dri).
# En Radxa 5A / Orange Pi 5 el valor por defecto es 103.
# Si tu placa usa un GID distinto, pásalo al comando o decláralo en .env:
#   RENDER_GID=<n> docker compose -f docker-compose.yml -f docker-compose.arm64.yml up -d
#   getent group render   → muestra el GID correcto
#
# Monitorización de carga NPU:
#   Ruta primaria  : /sys/class/devfreq/<npu>/load  (sin root, sin volúmenes extra)
#   Ruta de reserva: /sys/kernel/debug/rknpu/load   (proporciona detalle por núcleo;
#     requiere descomentar el volumen debugfs más abajo y RENDER_GID con acceso a debugfs)

services:
  web-ide:
    platform: linux/arm64
    # Imagen pre-construida para despliegue en Radxa (via docker load).
    # En la máquina de build: docker buildx build --platform linux/arm64 -t python-web-ide:arm64 --load .
    # Exportar: docker save python-web-ide:arm64 | gzip > python-web-ide-arm64.tar.gz
    # En Radxa:  docker load < python-web-ide-arm64.tar.gz
    #            docker compose -f docker-compose.yml -f docker-compose.arm64.yml up -d
    image: python-web-ide:arm64

    # Anular la reserva GPU NVIDIA que viene del docker-compose.yml base.
    # Sin esto, Docker intentaría inicializar el runtime nvidia en arm64 y fallaría.
    # Requiere docker compose >= 2.24 (soporte de !reset). Si tu versión es anterior,
    # comenta manualmente el bloque 'reservations' en docker-compose.yml antes de usar este override.
    deploy:
      resources:
        reservations:
          devices: !reset []

    # Render nodes de la NPU — necesarios para inferencia con rknn-toolkit-lite2
    devices:
      - /dev/dri:/dev/dri

    # GID del grupo 'render' del host; por defecto 103 (Radxa 5A, Orange Pi 5).
    # Sobrescribir con: RENDER_GID=<n> docker compose ... up -d
    group_add:
      - "${RENDER_GID:-103}"

    # ── Volúmenes para despliegue con imagen importada ───────────────────────
    # Reemplaza los volúmenes del base: descarta el bind mount .:/app (que
    # pistaría la app dentro de la imagen) y los anonymous volumes de shield.
    # Solo persiste los datos de usuario en el host.
    volumes:
      - ./data:/app/data

    # ── Volumen debugfs (OPCIONAL) ────────────────────────────────────────────
    # Descomenta si quieres detalle de carga por núcleo (Core0/Core1/Core2) en
    # el panel de rendimiento. No es necesario para la monitorización básica:
    # la ruta primaria /sys/class/devfreq/<npu>/load funciona sin este volumen.
    #
    #   - /sys/kernel/debug:/sys/kernel/debug:ro
    #
    # Si activas el volumen y el host tiene debugfs con permisos 700 (root),
    # añade también:
    #   cap_add:
    #     - DAC_READ_SEARCH
